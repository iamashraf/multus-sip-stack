apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher-sync
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher-sync
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: dispatcher-sync
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: dispatcher-sync
  apiGroup: rbac.authorization.k8s.io

namespace: voice
image: localhost/freeswitch:local
replicas: 2
# Lab-sized, not the 3600s the production doc proposes - long enough to
# let a short demo call finish draining, not so long a `kubectl delete`
# hangs around for an hour.
drainTimeoutSeconds: 50
terminationGracePeriodSeconds: 60
sbcMediaIP: ""   # set per environment - entrypoint.sh fails fast if this doesn't route via net1

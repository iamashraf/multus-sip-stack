{{- $mode := ternary "bridge" "l2" (eq .Values.voiceNetwork.attachmentType "macvlan") }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: voice-pool
  namespace: {{ .Values.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "{{ .Values.voiceNetwork.attachmentType }}",
      "master": "{{ .Values.voiceNetwork.master }}",
      "mode": "{{ $mode }}",
      "ipam": {
        "type": "whereabouts",
        "range": "{{ .Values.voiceNetwork.subnet }}",
        "range_start": "{{ .Values.rtpengine.pool.rangeStart }}",
        "range_end": "{{ .Values.rtpengine.pool.rangeEnd }}"
        {{- if .Values.voiceNetwork.routes }},
        "routes": [
          {{- range $i, $r := .Values.voiceNetwork.routes }}
          {{- if $i }},{{ end }}
          {"dst": "{{ $r }}"}
          {{- end }}
        ]
        {{- end }}
      }
    }

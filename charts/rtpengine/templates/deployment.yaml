apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtpengine
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtpengine
  template:
    metadata:
      labels:
        app: rtpengine
      annotations:
        k8s.v1.cni.cncf.io/networks: voice-pool
    spec:
      tolerations:
        - key: voice-edge
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        voice-role: edge
      containers:
        - name: rtpengine
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RTP_PORT_MIN
              value: "{{ .Values.rtpPortMin }}"
            - name: RTP_PORT_MAX
              value: "{{ .Values.rtpPortMax }}"
---
apiVersion: v1
kind: Service
metadata:
  name: rtpengine
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rtpengine
  ports:
    - name: ng
      port: 2223
      protocol: UDP

# Local kind lab. Same charts as every other environment - only these
# values differ. See dev-docs/local-lab.md for how this maps onto the podman
# "voice" network.

voiceNetwork:
  attachmentType: macvlan   # local default: Docker/Podman bridge has no switch MAC-per-port limit.
  master: eth1
  subnet: 192.168.50.0/24
  routes: []                 # SBC is on the same L2 segment as the edge nodes locally, so none needed.

sbc:
  ip: 192.168.50.5

# charts/kamailio - one Deployment per instance, each with its own static net1 IP.
instances:
  - name: kamailio-a
    ip: 192.168.50.20
  - name: kamailio-b
    ip: 192.168.50.21

# charts/kamailio - FreeSWITCH pod IPs for the dispatcher list. Static for
# now (bare-minimum demo); Phase 5 replaces this with EndpointSlice sync.
dispatcher:
  - 10.244.3.36
  - 10.244.3.35

rtpengine:
  pool:
    # Whereabouts' "range" CIDR sets the pod interface's subnet mask, not
    # just the allocatable set - using the narrow .128/26 slice here gave
    # rtpengine pods a /26 mask, so the kernel treated the SBC (.5) as
    # off-subnet and routed SBC-bound RTP out eth0 instead of net1, which
    # is why reverse media never arrived. range_start/range_end restrict
    # allocation to .128-.191 while range stays the real /24 segment.
    rangeStart: 192.168.50.128
    rangeEnd: 192.168.50.191
